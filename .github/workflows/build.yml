name: build

# ad ogni push su main e ad ogni pull request compila l'app e l'installer (scaricabile dagli artifact).
# con un tag (v1.1.3 oppure 1.1.3, anche con -beta) allega l'installer alla release.
# la versione viene dal tag; senza tag viene dal csproj, così l'installer riporta sempre il numero giusto.
on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (Select-Xml -Path yourlittlefriend.csproj -XPath '//Version').Node.InnerText }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Versione: $v"

      - name: Compila (self-contained, un solo exe)
        shell: pwsh
        run: >
          dotnet publish yourlittlefriend.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\yourlittlefriend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          # se la release esiste già (creata a mano) si aggiunge solo l'installer, senza toccare titolo e note.
          # un tag col trattino (1.1.3-beta) e' una pre-release solo se la release viene creata da qui
          prerelease: ${{ contains(github.ref_name, '-') && 'true' || '' }}
